[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rootcastle-rei-rea"
version = "0.1.0"
description = "Evidence-first reverse engineering workbench: central tool catalog, static triage, MCP, skills and tamper-evident cases"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Rootcastle Engineering & Innovation"}]
keywords = ["reverse-engineering", "binary-analysis", "digital-forensics", "static-analysis", "model-context-protocol", "mcp-server", "artifact-analysis", "firmware-analysis", "evidence-management", "python"]
classifiers = ["Development Status :: 3 - Alpha", "Intended Audience :: Developers", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.13", "Operating System :: OS Independent", "Topic :: Software Development :: Libraries :: Python Modules"]

[project.urls]
Homepage = "https://rootcastle.com"
Repository = "https://github.com/rootcastleco/Rei-Reverse-engineer-"
Documentation = "https://github.com/rootcastleco/Rei-Reverse-engineer-#readme"
Issues = "https://github.com/rootcastleco/Rei-Reverse-engineer-/issues"

[project.scripts]
rei-rea = "rei_rea.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rei_rea = ["data/*.json", "webui/*.html"]
